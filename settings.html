<div id="bs-biotracker-settings" class="bs-bt-device theme-retro" data-view="home">
  <div class="bs-bt-hardware-detail bs-bt-metal-corner bs-bt-corner-tl"></div>
  <div class="bs-bt-hardware-detail bs-bt-metal-corner bs-bt-corner-tr"></div>
  <div class="bs-bt-hardware-detail bs-bt-screw bs-bt-screw-tl"></div>
  <div class="bs-bt-hardware-detail bs-bt-screw bs-bt-screw-tr"></div>
  <div class="bs-bt-hardware-detail bs-bt-screw bs-bt-screw-bl"></div>
  <div class="bs-bt-hardware-detail bs-bt-screw bs-bt-screw-br"></div>

  <div class="bs-bt-brand" id="bs-bt-brand">Bastneth Pager</div>

  <div class="bs-bt-screen-shell">
    <div class="bs-bt-screen" id="bs-bt-screen">
      <div class="bs-bt-screen-header">
        <span id="bs-bt-time">--:--</span>
        <span id="bs-bt-title">HOME</span>
        <span id="bs-bt-status-icons" class="bs-bt-status-icons" aria-label="battery status">
          <svg class="bs-bt-battery-icon" viewBox="0 0 30 14" fill="none" xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true">
            <rect x="1" y="1" width="24" height="12" rx="2" stroke="currentColor" stroke-width="2"></rect>
            <rect id="bs-bt-battery-fill" x="4" y="4" width="16" height="6" rx="1" fill="currentColor"></rect>
            <rect x="26" y="4" width="3" height="6" rx="1" fill="currentColor"></rect>
          </svg>
        </span>
      </div>

      <div class="bs-bt-screen-content" id="bs-bt-viewport">
        <section id="bs-bt-view-home" class="bs-bt-view is-active" data-view="home">
          <div class="bs-bt-panel">
            <div class="bs-bt-menu-grid">
              <button class="bs-bt-home-tile" type="button" data-nav-view="worldbook-filter">
                <span class="bs-bt-home-tile__icon bs-bt-home-tile__icon--filter" aria-hidden="true"></span>
                <span class="bs-bt-home-tile__label">排除</span>
              </button>
              <button class="bs-bt-home-tile" type="button" data-nav-view="register">
                <span class="bs-bt-home-tile__icon bs-bt-home-tile__icon--register" aria-hidden="true"></span>
                <span class="bs-bt-home-tile__label">注册</span>
              </button>
              <button class="bs-bt-home-tile" type="button" data-nav-view="track-list">
                <span class="bs-bt-home-tile__icon bs-bt-home-tile__icon--track" aria-hidden="true"></span>
                <span class="bs-bt-home-tile__label">追踪</span>
              </button>
              <button class="bs-bt-home-tile" type="button" data-nav-view="full-state">
                <span class="bs-bt-home-tile__icon bs-bt-home-tile__icon--json" aria-hidden="true"></span>
                <span class="bs-bt-home-tile__label">变量</span>
              </button>
              <button class="bs-bt-home-tile" type="button" data-nav-view="time-lapse">
                <span class="bs-bt-home-tile__icon bs-bt-home-tile__icon--clock" aria-hidden="true"></span>
                <span class="bs-bt-home-tile__label">时间</span>
              </button>
              <button class="bs-bt-home-tile" type="button" data-nav-view="race-encyclopedia">
                <span class="bs-bt-home-tile__icon bs-bt-home-tile__icon--dna" aria-hidden="true"></span>
                <span class="bs-bt-home-tile__label">百科</span>
              </button>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-system" class="bs-bt-view" data-view="system">
          <div class="bs-bt-panel">
            <div class="bs-bt-section-title">主题风格</div>
            <div class="bs-bt-theme-list" id="bs-bt-theme-list">
              <button type="button" class="bs-bt-theme-option" data-theme-option="retro">1. 仿真 (Retro)</button>
              <button type="button" class="bs-bt-theme-option" data-theme-option="cultivation">2. 修仙 (Jade)</button>
              <button type="button" class="bs-bt-theme-option" data-theme-option="fantasy">3. 西幻 (Fantasy)</button>
              <button type="button" class="bs-bt-theme-option" data-theme-option="cyber-egypt">4. 埃及 (Cyber)</button>
              <button type="button" class="bs-bt-theme-option" data-theme-option="wasteland">5. 废土 (Pip-Boy)</button>
              <button type="button" class="bs-bt-theme-option" data-theme-option="sakura">6. 樱花 (Modern)</button>
            </div>

            <hr class="sysHR" />

            <div class="settings_section flex-container alignitemscenter">
              <input type="checkbox" id="bs-bt-enabled" />
              <label for="bs-bt-enabled">启用异步生理状态追踪</label>
            </div>

            <div class="settings_section flex-container alignitemscenter">
              <input type="checkbox" id="bs-bt-use-st-preset" />
              <label for="bs-bt-use-st-preset">套用 ST 当前预设</label>
            </div>

            <div class="settings_section">
              <label for="bs-bt-api-url">OpenAI 兼容 API Base URL</label>
              <input id="bs-bt-api-url" class="text_pole" type="text" placeholder="https://api.example.com/v1" />
            </div>

            <div class="settings_section">
              <label for="bs-bt-api-key">API Key</label>
              <input id="bs-bt-api-key" class="text_pole" type="password" placeholder="sk-..." />
            </div>

            <div class="settings_section flex-container gap8 bs-bt-connect-row">
              <button id="bs-bt-connect" class="menu_button" type="button">连接并拉取模型</button>
              <div id="bs-bt-connect-status" class="bs-bt-connect-status">尚未连接</div>
            </div>

            <div class="settings_section">
              <label for="bs-bt-model-list">模型列表</label>
              <select id="bs-bt-model-list" class="text_pole">
                <option value="">请先连接并拉取模型</option>
              </select>
            </div>

            <div class="settings_section">
              <label for="bs-bt-model">模型名称</label>
              <input id="bs-bt-model" class="text_pole" type="text" placeholder="gpt-4.1-mini" />
            </div>

            <div class="settings_section">
              <label for="bs-bt-trigger">触发时机</label>
              <select id="bs-bt-trigger" class="text_pole">
                <option value="after_ai">after_ai</option>
                <option value="after_user">after_user</option>
              </select>
            </div>

            <div class="settings_section">
              <label for="bs-bt-poll-ms">轮询间隔（毫秒）</label>
              <input id="bs-bt-poll-ms" class="text_pole" type="number" min="800" step="100" />
            </div>

            <div class="settings_section">
              <label for="bs-bt-context-size">送入分析的最近消息数</label>
              <input id="bs-bt-context-size" class="text_pole" type="number" min="2" step="1" />
            </div>

            <div class="settings_section flex-container gap8">
              <button id="bs-bt-save" class="menu_button" type="button">保存设置</button>
            </div>

            <hr class="sysHR" />

            <div class="settings_section bs-bt-action-row">
              <button id="bs-bt-clear" class="menu_button" type="button">清除当前聊天状态</button>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-register" class="bs-bt-view" data-view="register">
          <div class="bs-bt-panel">
            <div class="settings_section">
              <label for="bs-bt-register-name">注册角色名</label>
              <input id="bs-bt-register-name" class="text_pole" type="text" placeholder="露比" />
            </div>

            <div class="settings_section">
              <label for="bs-bt-register-race">注册种族</label>
              <div class="bs-bt-race-picker-wrap">
                <div class="bs-bt-race-input-row">
                  <input id="bs-bt-register-race" class="text_pole" type="text" value="人类"
                    placeholder="人类 / 混血 / 衍生 / 子项" />
                  <button type="button" class="bs-bt-race-picker-button" data-race-picker-target="bs-bt-register-race"
                    title="种族调色盘" aria-label="种族调色盘">☥</button>
                </div>
                <div id="bs-bt-register-race-palette-anchor"></div>
              </div>
            </div>

            <div class="settings_section">
              <label for="bs-bt-register-custom-notes">注册自订补充设定</label>
              <textarea id="bs-bt-register-custom-notes" class="text_pole bs-bt-textarea" rows="3"
                placeholder="例如：羊膜绒毛膜为 MCMA、时常泌乳体质、特殊繁殖设定等"></textarea>
            </div>

            <div class="settings_section">
              <label for="bs-bt-registry-normal-description">注册默认 normalDescription 规则</label>
              <textarea id="bs-bt-registry-normal-description" class="text_pole bs-bt-textarea" rows="7"></textarea>
            </div>

            <div class="settings_section">
              <label for="bs-bt-registry-closeup-description">注册默认 closeupDescription 规则</label>
              <textarea id="bs-bt-registry-closeup-description" class="text_pole bs-bt-textarea" rows="8"></textarea>
            </div>

            <div class="settings_section">
              <label for="bs-bt-registry-pregnant-description">注册默认 pregnantDescription 规则</label>
              <textarea id="bs-bt-registry-pregnant-description" class="text_pole bs-bt-textarea" rows="8"></textarea>
            </div>

            <div class="settings_section bs-bt-action-row">
              <button id="bs-bt-register-run" class="menu_button" type="button">注册当前角色</button>
            </div>

            <hr class="sysHR" />

            <div class="settings_section">
              <div class="bs-bt-status-title">注册状态</div>
              <pre id="bs-bt-register-status"
                class="bs-bt-status-box">输入名字与 Description 规则后发送注册请求，完成后可在“完整变量”查看该角色状态变量。</pre>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-track-list" class="bs-bt-view" data-view="track-list">
          <div class="bs-bt-panel">
            <div class="settings_section">
              <div id="bs-bt-track-character-list" class="bs-bt-track-character-list"></div>
            </div>

            <div class="settings_section">
              <div class="bs-bt-status-title">最新工具调用</div>
              <pre id="bs-bt-track-last-call" class="bs-bt-status-box">尚无数据</pre>
            </div>

            <div class="settings_section bs-bt-action-row">
              <button id="bs-bt-run" class="menu_button" type="button">立即分析当前对话</button>
            </div>

            <div class="settings_section" hidden>
              <label for="bs-bt-targets">目标女性角色名（逗号分隔，可留空）</label>
              <input id="bs-bt-targets" class="text_pole" type="text" placeholder="艾莉丝,露比" />
            </div>

            <div class="settings_section" hidden>
              <label for="bs-bt-system-prompt">角色提示词 / 异步分析系统提示词</label>
              <textarea id="bs-bt-system-prompt" class="text_pole bs-bt-textarea" rows="10"></textarea>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-worldbook-filter" class="bs-bt-view" data-view="worldbook-filter">
          <div class="bs-bt-panel">
            <div class="settings_section">
              <label for="bs-bt-tracker-worldbook-mode">传输模式</label>
              <select id="bs-bt-tracker-worldbook-mode" class="text_pole">
                <option value="exclude">正常模式：传输启用条目，可手动排除</option>
                <option value="allowlist_all">参考模式：默认全排除，仅传输手动指定条目（可包含 disabled）</option>
              </select>
            </div>

            <div class="settings_section bs-bt-action-row">
              <button id="bs-bt-worldbook-clear-all" class="menu_button" type="button">清空当前文本框</button>
            </div>

            <div class="settings_section">
              <div class="bs-bt-status-title">可排除条目</div>
              <input id="bs-bt-worldbook-entry-search" class="text_pole" type="text" placeholder="搜索条目名，缩小勾选范围" style="margin-bottom:8px;" />
              <div id="bs-bt-worldbook-entry-list" class="bs-bt-theme-list"></div>
            </div>

            <div class="settings_section">
              <label for="bs-bt-worldbook-filter-input" id="bs-bt-worldbook-filter-input-label">可排除</label>
              <textarea id="bs-bt-worldbook-filter-input" class="text_pole bs-bt-textarea" rows="6" placeholder="每行一个条目名。正常模式下，这些条目会从 worldbook 传输中排除。"></textarea>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-track-char" class="bs-bt-view" data-view="track-char">
          <div class="bs-bt-panel">
            <div class="settings_section bs-bt-action-row">
              <button id="bs-bt-track-back" class="menu_button" type="button">返回人物清单</button>
            </div>

            <div class="settings_section">
              <div class="bs-bt-track-dashboard">
                <div class="bs-bt-track-tabs" id="bs-bt-track-tabs">
                  <button type="button" class="bs-bt-track-tab" data-track-tab="overview">概览</button>
                  <button type="button" class="bs-bt-track-tab" data-track-tab="description">描述</button>
                  <button type="button" class="bs-bt-track-tab" data-track-tab="pregnancy">妊娠</button>
                  <button type="button" class="bs-bt-track-tab" data-track-tab="experience">经历</button>
                  <button type="button" class="bs-bt-track-tab" data-track-tab="debug">调试</button>
                </div>
                <div id="bs-bt-track-content" class="bs-bt-track-content"></div>
              </div>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-full-state" class="bs-bt-view" data-view="full-state">
          <div class="bs-bt-panel">
            <div class="settings_section">
              <div class="bs-bt-status-title">完整变量</div>
              <div id="bs-bt-home-full-state-list" class="bs-bt-theme-list"></div>
            </div>

            <hr class="sysHR" />

            <div class="settings_section">
              <div class="bs-bt-status-title">变量内容</div>
              <textarea id="bs-bt-full-state-output" class="text_pole bs-bt-textarea" rows="18" spellcheck="false">请选择角色查看完整变量。</textarea>
              <div id="bs-bt-full-state-edit-status" class="bs-bt-inline-status">可直接编辑 JSON，应用前会检查格式与基础结构。</div>
              <div class="settings_section bs-bt-action-row">
                <button id="bs-bt-full-state-apply" class="menu_button" type="button" disabled>应用修改</button>
                <button id="bs-bt-full-state-reset" class="menu_button" type="button" disabled>重置显示</button>
              </div>
            </div>

            <div class="settings_section bs-bt-action-row">
              <button id="bs-bt-full-state-unregister" class="menu_button" type="button" disabled>注销当前角色</button>
            </div>

            <div id="bs-bt-full-state-confirm" class="settings_section" style="display:none;">
              <div class="bs-bt-status-title">注销确认</div>
              <pre id="bs-bt-full-state-confirm-text" class="bs-bt-status-box">请选择角色。</pre>
              <div class="settings_section bs-bt-action-row">
                <button id="bs-bt-full-state-confirm-yes" class="menu_button" type="button">确认注销</button>
                <button id="bs-bt-full-state-confirm-no" class="menu_button" type="button">取消</button>
              </div>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-time-lapse" class="bs-bt-view" data-view="time-lapse">
          <div class="bs-bt-panel">
            <div class="settings_section">
              <div class="bs-bt-status-title" style="text-align: center; margin-bottom: 12px;">推进生理时间 (作用于所有角色)</div>

              <div style="display: grid; gap: 8px;">
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                  <label>
                    <div style="text-align: center; font-size: 0.85em; margin-bottom: 2px;">年</div><input
                      id="bs-bt-time-year" type="number" class="text_pole" value="0" min="0"
                      style="text-align: center;" />
                  </label>
                  <label>
                    <div style="text-align: center; font-size: 0.85em; margin-bottom: 2px;">月</div><input
                      id="bs-bt-time-month" type="number" class="text_pole" value="0" min="0"
                      style="text-align: center;" />
                  </label>
                  <label>
                    <div style="text-align: center; font-size: 0.85em; margin-bottom: 2px;">周</div><input
                      id="bs-bt-time-week" type="number" class="text_pole" value="0" min="0"
                      style="text-align: center;" />
                  </label>
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                  <label>
                    <div style="text-align: center; font-size: 0.85em; margin-bottom: 2px;">天</div><input
                      id="bs-bt-time-day" type="number" class="text_pole" value="0" min="0"
                      style="text-align: center;" />
                  </label>
                  <label>
                    <div style="text-align: center; font-size: 0.85em; margin-bottom: 2px;">时</div><input
                      id="bs-bt-time-hour" type="number" class="text_pole" value="0" min="0"
                      style="text-align: center;" />
                  </label>
                  <label>
                    <div style="text-align: center; font-size: 0.85em; margin-bottom: 2px;">分</div><input
                      id="bs-bt-time-minute" type="number" class="text_pole" value="0" min="0"
                      style="text-align: center;" />
                  </label>
                </div>
              </div>

              <div class="settings_section bs-bt-action-row" style="margin-top:12px;">
                <button id="bs-bt-time-lapse-submit" class="menu_button" type="button">执行流逝</button>
              </div>

              <pre id="bs-bt-time-lapse-status" class="bs-bt-status-box"
                style="margin-top:12px;">准备就绪，选择时间后执行以推进所有角色的状态。</pre>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-race-encyclopedia" class="bs-bt-view" data-view="race-encyclopedia">
          <div class="bs-bt-panel">
            <div class="settings_section">
              <div id="bs-bt-race-count" class="bs-bt-status-title">内置种族数量：0</div>
            </div>

            <div class="settings_section">
              <label for="bs-bt-race-select">选择种族</label>
              <select id="bs-bt-race-select" class="text_pole">
                <option value="">请选择种族</option>
              </select>
            </div>

            <div class="settings_section">
              <div class="bs-bt-status-title">种族资料</div>
              <pre id="bs-bt-race-output" class="bs-bt-status-box">请选择种族查看资料。</pre>
            </div>

            <div class="settings_section">
              <label for="bs-bt-derived-select">选择衍生</label>
              <select id="bs-bt-derived-select" class="text_pole">
                <option value="">请选择衍生</option>
              </select>
            </div>

            <div class="settings_section">
              <div class="bs-bt-status-title">衍生资料</div>
              <pre id="bs-bt-derived-output" class="bs-bt-status-box">请选择衍生查看 Flux 资料。</pre>
            </div>
          </div>
        </section>
      </div>

      <div id="bs-bt-power-off-screen" class="bs-bt-power-off-overlay">
        <div>𓃠<br />~nya</div>
      </div>
    </div>
  </div>

  <div class="bs-bt-physical-buttons">
    <button id="bs-bt-system-button" class="bs-bt-physical-button" type="button" title="SYSTEM" aria-label="SYSTEM">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
      </svg>
    </button>
    <button id="bs-bt-home-button" class="bs-bt-physical-button" type="button" title="HOME" aria-label="HOME">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </button>
    <button id="bs-bt-close" class="bs-bt-physical-button bs-bt-physical-button-off" type="button" title="CLOSE"
      aria-label="CLOSE">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </button>
  </div>
</div>
